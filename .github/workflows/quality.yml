name: Foundation quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build existing secret-free parser stages
        run: |
          docker build --target validator -t atlas-a01-validator ops/scanner
          docker build --target extractor -t atlas-a01-extractor -f ops/extractor/Dockerfile ops
      - name: Obtain official signatures in a separate disposable updater
        run: |
          docker volume create atlas-a01-signatures
          docker run --rm --user 0 --entrypoint chown -v atlas-a01-signatures:/signatures atlas-a01-validator 10001:10001 /signatures
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --memory 2g -v atlas-a01-signatures:/signatures atlas-a01-validator freshclam --config-file=/etc/clamav/freshclam.conf
      - name: Real offline ClamAV and qpdf, limits and watchdog
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 3g --cpus 1 --pids-limit 32 --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev -v atlas-a01-signatures:/signatures:ro -i atlas-a01-validator python - < tests/scanner/engine_smoke.py
      - name: Real offline Poppler extraction
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 640m --cpus 1 --pids-limit 16 --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev -i atlas-a01-extractor python - < tests/extractor/engine_smoke.py
      - if: always()
        run: docker volume rm atlas-a01-signatures
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_only
          POSTGRES_DB: atlas_p01_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://atlas:atlas_ci_only@127.0.0.1:5432/atlas_p01_test_ci
      ATLAS_TEST_ADMIN_URL: postgresql://atlas:atlas_ci_only@127.0.0.1:5432/atlas_p01_test_ci
      ATLAS_TEST_DATABASE_URL: postgresql://atlas_p01_test_runtime:atlas_runtime_ci_only@127.0.0.1:5432/atlas_p01_test_ci
      ATLAS_TEST_AI_WORKER_URL: postgresql://atlas_p01_test_ai_worker:atlas_ai_worker_ci_only@127.0.0.1:5432/atlas_p01_test_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm db:validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/scanner -v
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/extractor -v
      - name: Reproduce Supabase browser defaults on the disposable database
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon,authenticated; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon,authenticated;'
      - run: pnpm --filter @atlas/database exec prisma migrate deploy
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/database/constraints.sql
      - name: Create isolated non-owner test role
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE atlas_p01_test_runtime LOGIN INHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'atlas_runtime_ci_only'; GRANT atlas_runtime TO atlas_p01_test_runtime; CREATE ROLE atlas_p01_test_ai_worker LOGIN INHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'atlas_ai_worker_ci_only'; GRANT atlas_ai_worker TO atlas_p01_test_ai_worker;"
      - run: pnpm test:integration
      - name: Repeat deploy preserves completed migration history
        run: pnpm --filter @atlas/database exec prisma migrate deploy
      - name: Fail closed on effective migration-history access
        run: psql "$DIRECT_URL" -X -v ON_ERROR_STOP=1 -f ops/sql/a01-migration-history-gate.sql
      - name: Rehearse synthetic database restore and application authorization
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            # Ubuntu's default client can lag the PG17 fixture server.
            # Use the official signed PGDG repository, client tools only.
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | grep --fixed-strings --quiet B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            . /etc/os-release
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-client-17
          fi
          PATH="/usr/lib/postgresql/17/bin:$PATH" python3 tests/database/rehearse_restore.py
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  isolated-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ATLAS_MODE: live
      ATLAS_ORIGIN: http://127.0.0.1:3102
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: atlas-disposable-local-publishable-key
      DATABASE_URL: postgresql://atlas_auth_runtime:atlas_runtime_test_only@127.0.0.1:55432/atlas_auth_test
      DIRECT_URL: postgresql://atlas_test_migrator:atlas_local_test_only@127.0.0.1:55432/atlas_auth_test
      ATLAS_RATE_SECRET: atlas-disposable-test-rate-secret-32-characters
      ATLAS_CURSOR_SECRET: atlas-disposable-test-cursor-secret-32-characters
      ATLAS_DEV_INVITATION_LINKS: 'true'
      # Phase 02: loopback provider fixture, disposable Storage service key
      # (signed with the harness-only JWT secret) and scanner protocol secret.
      ATLAS_OPENALEX_BASE_URL: http://127.0.0.1:3199
      ATLAS_SEMANTIC_SCHOLAR_BASE_URL: http://127.0.0.1:3199
      ATLAS_STORAGE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoiYXRsYXMtZGlzcG9zYWJsZS10ZXN0IiwiaWF0IjoxNzYxMDAwMDAwLCJleHAiOjIwNzYwMDAwMDB9.vwfFL54Ji7i_UTmFN6ETLrQmYethv-rhB9XImN5WL_E
      ATLAS_SCANNER_SECRET: atlas-disposable-test-scanner-secret-32-characters
      ATLAS_EXTRACTION_SECRET: atlas-disposable-test-extraction-secret-32-characters
      ATLAS_AI_WORKER_DATABASE_URL: postgresql://atlas_auth_ai_worker:atlas_ai_worker_test_only@127.0.0.1:55432/atlas_auth_test
      ATLAS_AI_ACTIVATION: isolated-local
      ATLAS_AI_FIXTURE_ORIGIN: http://127.0.0.1:3198
      ATLAS_AI_MODEL_POLICY: '{"provider":"openai","model":"synthetic-model","contextTokens":64000,"maxOutputTokens":1000,"inputMicrosPerMillion":100000,"outputMicrosPerMillion":200000}'
      ATLAS_AI_MONTHLY_LIMIT_MICROS: '10000000'
      ATLAS_AI_EMBEDDING_PROVIDER: openai
      ATLAS_AI_EMBEDDING_MODEL: synthetic-embedding
      ATLAS_AI_EMBEDDING_REVISION: v1
      ATLAS_AI_EMBEDDING_MICROS_PER_MILLION: '1000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Auth (startup diagnostics contain no user sessions)
        run: |
          if ! docker compose -f tests/auth/compose.yml up -d --wait; then
            docker compose -f tests/auth/compose.yml logs --no-color auth storage
            exit 1
          fi
      - run: pnpm --filter @atlas/database exec prisma migrate deploy
      - run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "GRANT atlas_runtime TO atlas_auth_runtime; CREATE ROLE atlas_auth_ai_worker LOGIN INHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD 'atlas_ai_worker_test_only'; GRANT atlas_ai_worker TO atlas_auth_ai_worker;"
      - run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:auth:e2e
      # No auth traces/screenshots/mailbox/log upload: tokens remain ephemeral.
      - if: always()
        run: docker compose -f tests/auth/compose.yml down --volumes
