server {
 listen 80;
 server_name localhost;
 # Auth and Storage only. No database or Data API service exists here.
 location /storage/v1/ {
  # Browsers upload/download with single-object signed grants; mirror the
  # hosted gateway's CORS for the local app origin only.
  if ($request_method = OPTIONS) {
   add_header Access-Control-Allow-Origin http://127.0.0.1:3102 always;
   add_header Access-Control-Allow-Methods 'GET, PUT, POST, OPTIONS' always;
   add_header Access-Control-Allow-Headers 'authorization, content-type, x-upsert, apikey, x-client-info, cache-control' always;
   add_header Access-Control-Max-Age 600 always;
   return 204;
  }
  proxy_hide_header Access-Control-Allow-Origin;
  add_header Access-Control-Allow-Origin http://127.0.0.1:3102 always;
  client_max_body_size 30m;
  proxy_pass http://storage:5000/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto http;
  proxy_set_header X-Forwarded-Prefix /storage/v1;
 }
 location /auth/v1/ {
  proxy_pass http://auth:9999/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto http;
 }
 location / { return 404; }
}
