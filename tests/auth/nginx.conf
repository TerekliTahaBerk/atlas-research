map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 80;
 server_name localhost;
 # Auth, Storage and Realtime only. No database or Data API service exists here.
 location /storage/v1/ {
  # Browsers upload/download with single-object signed grants; mirror the
  # hosted gateway's CORS for the local app origin only.
  if ($request_method = OPTIONS) {
   add_header Access-Control-Allow-Origin http://127.0.0.1:3102 always;
   add_header Access-Control-Allow-Methods 'GET, PUT, POST, OPTIONS' always;
   add_header Access-Control-Allow-Headers 'authorization, content-type, x-upsert, apikey, x-client-info, cache-control' always;
   add_header Access-Control-Max-Age 600 always;
   return 204;
  }
  proxy_hide_header Access-Control-Allow-Origin;
  add_header Access-Control-Allow-Origin http://127.0.0.1:3102 always;
  client_max_body_size 30m;
  proxy_pass http://storage:5000/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto http;
  proxy_set_header X-Forwarded-Prefix /storage/v1;
 }
 location /auth/v1/ {
  proxy_pass http://auth:9999/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto http;
 }
 # Realtime WebSocket. Like the hosted gateway, the publishable key is
 # exchanged for the (disposable) anon JWT; private channels still require the
 # user's own access token and the realtime.messages topic policy.
 location /realtime/v1/ {
  if ($args ~ "^(.*)apikey=[^&]*(.*)$") {
   set $args $1apikey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImF0bGFzLWRpc3Bvc2FibGUtdGVzdCIsImlhdCI6MTc2MTAwMDAwMCwiZXhwIjoyMDc2MDAwMDAwfQ.wEtrTttpbmXDIItpRs0-5H4CIzdcflTpuyvQ0MZaFVc$2;
  }
  proxy_pass http://realtime:4000/socket/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host realtime-dev.localhost;
  proxy_read_timeout 3600s;
 }
 location / { return 404; }
}
